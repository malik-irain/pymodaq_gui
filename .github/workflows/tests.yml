  tests:
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest"]
        python-version: ["3.9", "3.10", "3.11"]
        qt-backend: ["pyqt5", "pyqt6", "pyside6"]
    runs-on: ${{ matrix.os }}
    env:
      QT_DEBUG_PLUGINS: 1
      # keep software GL settings in env for processes started by the runner
      QT_OPENGL: software
      LIBGL_ALWAYS_SOFTWARE: 1
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          # NOTE: do NOT install pytest-xdist here (avoid parallel test workers)
          pip install flake8 pytest pytest-cov pytest-qt pytest-xvfb setuptools wheel numpy h5py ${{ matrix.qt-backend }}
          pip install -e .

      - name: Apt: install X11 / Mesa deps (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            x11-utils \
            yaru-theme-icon \
            fonts-dejavu-core fonts-dejavu-extra fonts-liberation \
            libxkbcommon-x11-0 \
            libxcb1 libx11-xcb1 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-cursor0 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 libxcb-shape0 \
            libxcb-shm0 libxcb-sync1 libxcb-xkb1 \
            libxext6 libxrender1 libxi6 libxrandr2 libxinerama1 libsm6 libxtst6 \
            libxcomposite1 libxcursor1 libxdamage1 \
            libfontconfig1 libfreetype6 \
            libgl1-mesa-dri libglx-mesa0 libglu1-mesa libglapi-mesa

      - name: Prepare env + misc (Linux only)
        if: runner.os == 'Linux'
        run: |
          # export vars for later steps
          echo "XDG_CURRENT_DESKTOP=Unity" >> $GITHUB_ENV
          echo "XDG_DATA_DIRS=/usr/share:/usr/share/icons:/usr/local/share" >> $GITHUB_ENV
          echo "GTK_THEME=Yaru" >> $GITHUB_ENV

      - name: Create fake xvfb-run on Windows (persist)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          echo '@echo off' > xvfb-run.bat
          echo %* >> xvfb-run.bat
          mkdir $env:USERPROFILE\bin -Force
          move xvfb-run.bat $env:USERPROFILE\bin\xvfb-run.bat
          echo "$env:USERPROFILE\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: Lint (flake8)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=docs || true

      - name: Run tests (Linux: start Xvfb in same shell; Windows: normal)
        id: tests
        shell: bash
        run: |
          mkdir -p coverage
          # run tests serially (no xdist). Start Xvfb in the same shell so DISPLAY is exported.
          if [ "${{ runner.os }}" = "Linux" ]; then
            # start Xvfb in background and set DISPLAY for this shell
            /usr/bin/Xvfb :99 -screen 0 1920x1080x24 -ac -nolisten tcp > /tmp/xvfb.log 2>&1 &
            export DISPLAY=:99
            echo "Started Xvfb (PID $!)"
            # ensure env var visible to pytest (redundant with job env, harmless)
            export QT_OPENGL=software
            export LIBGL_ALWAYS_SOFTWARE=1
            export QT_QPA_PLATFORM=offscreen
            # run tests (no -n)
            pytest -vv --cov=pymodaq_gui
          else
            # Windows (fake xvfb-run forwards args)
            pytest -vv --cov=pymodaq_gui
          fi
          # move coverage file if produced
          if [ -f .coverage ]; then
            mv .coverage coverage/coverage_${{ matrix.os }}_${{ matrix.python-version }}_${{ matrix.qt-backend }}
          fi

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}_${{ matrix.qt-backend }}
          path: coverage/coverage_${{ matrix.os }}_${{ matrix.python-version }}_${{ matrix.qt-backend }} || true
